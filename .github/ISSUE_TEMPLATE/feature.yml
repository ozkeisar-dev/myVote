name: Feature suggestion
description: Suggest a feature or improvement.
title: '[feat] '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest something. Focus on the problem
        and the user — implementation details are optional and can change.

        > **Are you on the team?** Use Multica, not GitHub Issues, for internal feature work.

  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the feature.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would the user experience this? Sketch the flow.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they're worse.

  - type: textarea
    id: scope
    attributes:
      label: In scope / out of scope
      description: Bullet list of what is included and what is explicitly NOT.
