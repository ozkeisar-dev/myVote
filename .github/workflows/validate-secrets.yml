name: validate-secrets
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Hetzner — auth check
        env:
          TOKEN: ${{ secrets.HETZNER_API_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/h.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.hetzner.cloud/v1/locations)
          echo "Hetzner HTTP $code"
          test "$code" = "200" || { cat /tmp/h.json; exit 1; }

      - name: Cloudflare — token verify
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer $TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | tee /tmp/cf.json | grep -q '"status":"active"' \
            || { echo "token not active"; cat /tmp/cf.json; exit 1; }

      - name: Cloudflare — account access
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID" \
            | tee /tmp/cfa.json | grep -q '"success":true' \
            || { cat /tmp/cfa.json; exit 1; }

      - name: Cloudflare — zone access
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID" \
            | tee /tmp/cfz.json | grep -q '"success":true' \
            || { cat /tmp/cfz.json; exit 1; }
